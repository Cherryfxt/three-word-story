<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>三词成故事</title><link rel="stylesheet" href="style.css"></head><body><main><header><div><div class="eyebrow">一分钟想象挑战</div><h1>三词成故事</h1><p class="intro">三个意想不到的词，一个有头有尾的故事。</p></div><span id="round">第 1 轮</span></header><section class="game"><div class="topline"><span id="status" aria-live="polite">准备好了吗？</span><div class="time"><span id="seconds">60</span><small id="clock-label">秒讲述</small></div></div><div class="track" aria-hidden="true"><div id="bar"></div></div><div class="words" id="words"></div><p id="prompt">点击开始揭晓三个词，准备 5 秒后开始 60 秒讲述。</p><div class="actions"><button class="primary" id="start">开始</button><button id="swap" hidden>换一批词</button></div></section><details><summary>看看词库 · <span id="word-count"></span> 个词</summary><div class="bank" id="bank"></div><p>每轮搭配物品、人物或生物，再加入场景或形容词。名人和较难词语附有说明；名人的故事可以想象，身份介绍是真实资料。词库用于创作练习，不是必背词表。</p></details><p class="foot" id="sound-note" hidden>当前设备未能启用声音，请留意屏幕上的结束提示。</p><p class="foot">先敢想，再讲清，最后把故事收住。没有唯一正确的故事。</p></main><script src="words.js"></script><script src="game.js"></script></body></html>
